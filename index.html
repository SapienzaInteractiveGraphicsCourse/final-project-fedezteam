<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario 3D Game</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden; /* Nasconde le barre di scorrimento */
      background-color: #87ceeb; /* Sfondo celeste tipo cielo */
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>

  <!-- Import Map: permette di usare le estensioni ufficiali di Three.js (come GLTFLoader e OrbitControls) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Elemento HTML che conterrà il render 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Collegamento al tuo file di codice principale -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
