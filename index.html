<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario 3D Game</title>

  <!-- Font Retro Arcade -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive, sans-serif;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #87ceeb;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* --- UI OVERLAY --- */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Pulsante retro generico */
    .btn-retro {
      padding: 15px 35px;
      font-size: 1rem;
      color: white;
      background: #43b047;
      border: 4px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #286e2b, 0 8px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.1s ease;
    }
    .btn-retro:hover {
      transform: scale(1.05);
      background: #4de052;
    }
    .btn-retro:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #286e2b;
    }

    /* Box del menù stile Mario */
    .menu-card {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.75);
      border: 4px solid #fff;
      border-radius: 16px;
      padding: 35px 30px;
      max-width: 620px;
      width: 90%;
      text-align: center;
      color: white;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* STEP 1: WELCOME */
    #welcome-screen h1 {
      font-size: 2.2rem;
      color: #e52521;
      text-shadow: 3px 3px 0px #fbd000, 5px 5px 0px #000;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    #welcome-screen p {
      font-size: 0.75rem;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 30px;
    }

    /* STEP 2: NAME & CHARACTER INPUT */
    #name-screen {
      display: none;
    }
    .subtitle {
      font-size: 0.65rem;
      color: #fbd000;
      margin-bottom: 12px;
    }
    #name-screen h2 {
      font-size: 1.2rem;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* SELEZIONE PERSONAGGIO */
    .char-selector {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      width: 100%;
      justify-content: center;
    }
    .char-card {
      flex: 1;
      padding: 12px 10px;
      background: #222;
      border: 3px solid #666;
      border-radius: 10px;
      color: #aaa;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.15s ease;
    }
    .char-card.selected-mario {
      border-color: #e52521;
      background: #8b0000;
      color: #fff;
      box-shadow: 0 0 10px #e52521;
    }
    .char-card.selected-luigi {
      border-color: #43b047;
      background: #1e5921;
      color: #fff;
      box-shadow: 0 0 10px #43b047;
    }

    .input-group {
      width: 100%;
      margin-bottom: 25px;
    }
    #hero-name-input {
      width: 100%;
      padding: 12px 15px;
      font-size: 0.85rem;
      border: 4px solid #fbd000;
      border-radius: 8px;
      background: #000;
      color: #fff;
      outline: none;
      text-align: center;
    }

    /* --- HUD IN GIOCO --- */
    #hud {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      justify-content: space-between;
      color: white;
      font-size: 0.8rem;
      text-shadow: 2px 2px 0px #000;
      pointer-events: none;
    }
    .hud-item {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 18px;
      border-radius: 8px;
      border: 3px solid #fff;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-layer">
    
    <!-- STEP 1: WELCOME SCREEN -->
    <div id="welcome-screen" class="menu-card">
      <h1>SUPER MARIO 3D</h1>
      <p>WELCOME TO THE REALM! EXPLORE THE WORLD, COLLECT COINS, AND COMPLETE YOUR QUEST.</p>
      <button id="start-btn" class="btn-retro">START</button>
    </div>

    <!-- STEP 2: NAME & CHARACTER SELECTION -->
    <div id="name-screen" class="menu-card">
      <div class="subtitle">BEFORE THE JOURNEY BEGINS</div>
      <h2>CHOOSE CHARACTER & NAME</h2>

      <!-- CARDS PER SCEGLIERE IL PERSONAGGIO -->
      <div class="char-selector">
        <button type="button" id="btn-mario" class="char-card selected-mario">🔴 MARIO</button>
        <button type="button" id="btn-luigi" class="char-card">🟢 LUIGI</button>
      </div>

      <div class="input-group">
        <input type="text" id="hero-name-input" placeholder="ENTER YOUR NAME..." maxlength="12" autocomplete="off">
      </div>

      <button id="continue-btn" class="btn-retro">CONTINUE</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item">HERO: <span id="hud-hero-name" style="color: #43b047;">MARIO</span></div>
      <div style="display: flex; gap: 10px;">
        <div class="hud-item">COINS: <span id="coins-count" style="color: #fbd000;">0</span></div>
        <div class="hud-item">LIVES: <span id="lives-count" style="color: #e52521;">3</span></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
