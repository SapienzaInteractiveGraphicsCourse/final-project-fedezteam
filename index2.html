<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario 3D Game</title>

  <!-- Font Retro Arcade -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive, sans-serif;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #87ceeb;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* --- UI OVERLAY --- */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* PULSANTI AZIONE (START / CONTINUE) */
    .btn-retro {
      padding: 20px 50px;
      font-size: 1.2rem;
      color: white;
      background: #43b047;
      border: 5px solid #fff;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 0 #286e2b, 0 10px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.1s ease;
    }
    .btn-retro:hover {
      transform: scale(1.06);
      background: #4de052;
    }
    .btn-retro:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #286e2b;
    }

    /* BOX MENÙ */
    .menu-card {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.85);
      border: 5px solid #fff;
      border-radius: 20px;
      padding: 45px 40px;
      max-width: 850px;
      width: 92%;
      text-align: center;
      color: white;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* STEP 1: WELCOME */
    #welcome-screen h1 {
      font-size: 2.4rem;
      color: #e52521;
      text-shadow: 4px 4px 0px #fbd000, 6px 6px 0px #000;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    #welcome-screen p {
      font-size: 0.8rem;
      line-height: 1.8;
      color: #fff;
      margin-bottom: 35px;
    }

    /* STEP 2: NAME & CHARACTER INPUT */
    #name-screen {
      display: none;
    }
    .subtitle {
      font-size: 0.7rem;
      color: #fbd000;
      margin-bottom: 12px;
    }
    #name-screen h2 {
      font-size: 1.3rem;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    /* SELEZIONE PERSONAGGIO */
    .char-selector {
      display: flex;
      gap: 30px;
      margin-bottom: 35px;
      width: 100%;
      justify-content: center;
    }
    .char-card {
      flex: 1;
      padding: 25px 20px;
      min-height: 260px;
      background: rgba(30, 30, 30, 0.9);
      border: 5px solid #555;
      border-radius: 18px;
      color: #aaa;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: all 0.2s ease;
    }
    .char-card img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.8));
      transition: transform 0.2s ease;
    }
    .char-card:hover img {
      transform: scale(1.12);
    }

    .char-card.selected-mario {
      border-color: #e52521;
      background: rgba(139, 0, 0, 0.88);
      color: #fff;
      box-shadow: 0 0 25px rgba(229, 37, 33, 0.7);
      transform: scale(1.05);
    }
    .char-card.selected-luigi {
      border-color: #43b047;
      background: rgba(30, 89, 33, 0.88);
      color: #fff;
      box-shadow: 0 0 25px rgba(67, 176, 71, 0.7);
      transform: scale(1.05);
    }

    .input-group {
      width: 100%;
      margin-bottom: 35px;
    }
    #hero-name-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1rem;
      border: 4px solid #fbd000;
      border-radius: 10px;
      background: #000;
      color: #fff;
      outline: none;
      text-align: center;
    }

    /* --- HUD IN GIOCO --- */
    #hud {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      justify-content: space-between;
      color: white;
      font-size: 0.85rem;
      text-shadow: 2px 2px 0px #000;
      pointer-events: none;
    }
    .hud-item {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 18px;
      border-radius: 8px;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Dimensione dell'icona del personaggio nell'HUD */
    #hud-char-icon {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-layer">
    
    <!-- STEP 1: WELCOME SCREEN -->
    <div id="welcome-screen" class="menu-card">
      <h1>SUPER MARIO 3D</h1>
      <p>WELCOME TO THE ISLAND! EXPLORE THE WORLD, DEFEAT THE ENEMIES AND COLLECT STAR.</p>
      <button id="start-btn" class="btn-retro">START</button>
    </div>

    <!-- STEP 2: NAME & CHARACTER SELECTION -->
    <div id="name-screen" class="menu-card">
      <div class="subtitle">BEFORE THE JOURNEY BEGINS</div>
      <h2>CHOOSE CHARACTER & NAME</h2>

      <div class="char-selector">
        <button type="button" id="btn-mario" class="char-card selected-mario">
          <img src="assets/images/mario.png" alt="Mario">
          <span>MARIO</span>
        </button>

        <button type="button" id="btn-luigi" class="char-card">
          <img src="assets/images/luigi.png" alt="Luigi">
          <span>LUIGI</span>
        </button>
      </div>

      <div class="input-group">
        <input type="text" id="hero-name-input" placeholder="ENTER NAME..." maxlength="12" autocomplete="off">
      </div>

      <button id="continue-btn" class="btn-retro">CONTINUE</button>
    </div>

    <!-- HUD CON ICONA PERSONAGGIO -->
    <div id="hud">
      <div class="hud-item">
        <img id="hud-char-icon" src="assets/images/mario-icon.png" alt="Hero Icon">
        <span id="hud-hero-name" style="color: #43b047;">MARIO</span>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="hud-item">COINS: <span id="coins-count" style="color: #fbd000;">0</span></div>
        <div class="hud-item">LIVES: <span id="lives-count" style="color: #e52521;">3</span></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main2.js"></script>

</body>
</html>
